<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1a2e"/>
      <stop offset="1" stop-color="#0f3460"/>
    </linearGradient>
    <radialGradient id="piece" cx="0.35" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#fffef5"/>
      <stop offset="1" stop-color="#fde8e8"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- board grid hint -->
  <g stroke="rgba(232,213,160,0.25)" stroke-width="2">
    <line x1="128" y1="96" x2="128" y2="416"/>
    <line x1="192" y1="96" x2="192" y2="416"/>
    <line x1="256" y1="96" x2="256" y2="416"/>
    <line x1="320" y1="96" x2="320" y2="416"/>
    <line x1="384" y1="96" x2="384" y2="416"/>
    <line x1="96" y1="256" x2="416" y2="256"/>
  </g>
  <!-- central piece: red 帅 -->
  <circle cx="256" cy="256" r="120" fill="url(#piece)" stroke="#c0392b" stroke-width="10"/>
  <text x="256" y="256" font-family="serif" font-size="160" font-weight="bold"
        fill="#c0392b" text-anchor="middle" dominant-baseline="central">帥</text>
</svg>
