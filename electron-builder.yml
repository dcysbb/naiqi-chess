appId: com.chessgame.darkchess
productName: 奶棋
copyright: Private use

directories:
  output: dist-desktop
  buildResources: build

# Application source files packed into app.asar.
files:
  - desktop/main.js
  - desktop/preload.js
  - server/**
  - package.json

# Serve the built client OUTSIDE the asar (cleaner static path resolution).
extraResources:
  - from: client/dist
    to: client-dist
    filter: ['**/*']

asarUnpack:
  - '**/node_modules/bonjour-service/**'

win:
  target:
    - nsis
  artifactName: naiqi-${version}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 奶棋

mac:
  target:
    - dmg
    - zip
  category: public.app-category.games
  artifactName: naiqi-${version}-${arch}.${ext}
  sign: build/sign-mac.js
  hardenedRuntime: false
  gatekeeperAssess: false
  notarize: false

# No certificate-backed code signing (self-use). macOS builds are ad-hoc signed
# in build/sign-mac.js; notarization still requires an Apple Developer ID.
forceCodeSigning: false
