name: Build Desktop Installers

# Produces signed-optional installers that can't be built in a symlink-restricted
# Windows environment (the local sandbox blocks winCodeSign's macOS .dylib
# symlink extraction). Run this on CI (symlinks work fine here) to get the real
# NSIS .exe (Windows) and .dmg (macOS).
#
# Trigger manually from the Actions tab, or on tag push.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag to receive the installers
        required: true
        default: v1.1.0
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: cd client && npm install
      - run: cd server && npm install
      - run: npm run build
      - run: npx electron-builder --win nsis --publish never
      - name: Upload Windows installer to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: gh release upload "$env:RELEASE_TAG" dist-desktop/*.exe --repo "${{ github.repository }}" --clobber
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: naiqi-windows-installer
          path: dist-desktop/*.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: cd client && npm install
      - run: cd server && npm install
      - run: npm run build
      - run: npx electron-builder --mac dmg zip --universal --publish never
      - run: |
          APP_PATH="$(find dist-desktop -name '奶棋.app' -type d | head -n 1)"
          test -n "$APP_PATH"
          codesign --verify --deep --strict "$APP_PATH"
          codesign -dv --verbose=2 "$APP_PATH"
      - name: Upload macOS packages to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: gh release upload "$RELEASE_TAG" dist-desktop/*.dmg dist-desktop/*.zip --repo "${{ github.repository }}" --clobber
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: naiqi-macos-universal
          path: |
            dist-desktop/*.dmg
            dist-desktop/*.zip
