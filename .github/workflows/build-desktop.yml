name: Build Release Packages

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag to receive the packages
        required: true
        default: v1.1.1
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: cd client && npm install
      - run: cd server && npm install
      - run: npm run build
      - name: Build self-contained Windows Web host
        run: npm run dist:web-host
      - run: npx electron-builder --win nsis --publish never
      - name: Upload Windows packages to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: gh release upload "$env:RELEASE_TAG" dist-desktop/*.exe dist-web-host/*.zip --repo "${{ github.repository }}" --clobber
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: naiqi-windows-installer
          path: dist-desktop/*.exe
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: naiqi-windows-web-host
          path: dist-web-host/*.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: cd client && npm install
      - run: cd server && npm install
      - run: npm run build
      - run: npx electron-builder --mac dmg zip --universal --publish never
      - run: |
          APP_PATH="$(find dist-desktop -name '奶棋.app' -type d | head -n 1)"
          test -n "$APP_PATH"
          codesign --verify --deep --strict "$APP_PATH"
          codesign -dv --verbose=2 "$APP_PATH"
      - name: Upload macOS packages to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: gh release upload "$RELEASE_TAG" dist-desktop/*.dmg dist-desktop/*.zip --repo "${{ github.repository }}" --clobber
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: naiqi-macos-universal
          path: |
            dist-desktop/*.dmg
            dist-desktop/*.zip

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: cd client && npm install
      - run: npm run build
      - run: cd client && npx cap sync android
      - run: cd client/android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Prepare Android APK
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          cp client/android/app/build/outputs/apk/debug/app-debug.apk "naiqi-${VERSION}-android.apk"
      - name: Upload Android APK to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: gh release upload "$RELEASE_TAG" naiqi-*-android.apk --repo "${{ github.repository }}" --clobber
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: naiqi-android-apk
          path: naiqi-*-android.apk
